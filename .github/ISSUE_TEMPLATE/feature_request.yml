name: ✨ 功能请求
description: 提出一个新功能、改进建议或设计想法
title: "[Feature] "
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        感谢你的想法！在提交之前，建议先看一眼 [路线图 ROADMAP](https://github.com/YOUR_NAME/tavern-dice/blob/main/docs/ROADMAP.md)
        —— 也许你想提的功能已经在计划中了，如果是这样，直接在对应条目下补充你的想法会更有效。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有的 Issues 与路线图，确认这不是重复提议
          required: true
        - label: 这个功能与「酒馆战斗掷骰」的核心定位（战力体系 + 本地 d20 结算）相关
          required: true

  - type: dropdown
    id: request-type
    attributes:
      label: 请求类型
      options:
        - 全新功能
        - 对现有功能的改进
        - 界面 / 交互体验
        - 文档改进
        - 性能优化
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题 / 使用场景
      description: |
        请描述**问题本身**，而不是直接跳到解决方案。
        例如：「在群聊里有多方混战时，我无法区分谁打谁」比「加一个阵营矩阵」更能说明需求。
      placeholder: 描述你的使用场景与痛点……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望这个功能怎么工作？如果能描述具体的交互流程会更好。
    validations:
      required: true

  - type: dropdown
    id: pipeline
    attributes:
      label: 涉及的环节
      description: 这个功能大致属于哪一部分？（可多选）
      multiple: true
      options:
        - P1 建表（读取世界书生成战力体系）
        - P2 更新（对话后增量更新战力表）
        - P3 战斗（掷骰与回合结算）
        - 界面 / 悬浮球 / 面板
        - 设置与 API 通道
        - 数据导入导出与分享
        - 文档与本地化
        - 不确定 / 其他
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 你是否尝试过其他做法？为什么它们不够好？
    validations:
      required: false

  - type: dropdown
    id: llm-impact
    attributes:
      label: 是否涉及额外的 LLM 调用
      description: 本扩展的一大优势是战斗结算零 token 消耗，因此这一点对设计取舍很关键。
      options:
        - 不涉及（纯本地即可实现）
        - 涉及，但很少（一次性 / 低频）
        - 涉及，且频繁调用
        - 不确定
    validations:
      required: true

  - type: dropdown
    id: breaking
    attributes:
      label: 是否可能破坏现有数据或接口
      description: 例如需要修改 `schemaVersion`、改变战力表结构或调整现有交互。
      options:
        - 不会
        - 可能需要新增可选的 schema 字段
        - 可能需要不兼容的改动
        - 不确定
    validations:
      required: true

  - type: textarea
    id: mockup
    attributes:
      label: 草图 / 参考
      description: 有界面草图、参考实现或其他扩展的做法？欢迎贴出来。
    validations:
      required: false

  - type: input
    id: willingness
    attributes:
      label: 你是否愿意自己提交 PR 实现它
      description: 只是方便维护者评估工作量，不是承诺。
      placeholder: "例如：愿意尝试 / 暂时没时间 / 只想提个想法"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 任何其他背景、约束或想法。
    validations:
      required: false
